[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safemcp-chat"
version = "0.1.0"
description = "Local MCP prompt-injection detection and authorization teaching project"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0", "streamlit==1.51.0", "openai==2.29.0",
  "python-dotenv==1.2.1", "jsonschema==4.25.0",
  "pandas==2.3.3", "matplotlib==3.10.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["safemcp", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
